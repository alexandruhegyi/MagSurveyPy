0" rx="10" fill="#e3f4e7" stroke="none" stroke-width="0" /><text x="1030" y="541" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142e4c" text-anchor="start">c(i) &lt;- interpolation between GPS boundary fixes</text><text x="1030" y="581" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#142e4c" text-anchor="start">p(i,s) = c(i) + u(i) d_cross + t(i) d_forward</text><text x="1014" y="628" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#496582" text-anchor="start"><tspan x="1014" dy="0">Trajectory direction defines the local sensor frame;</tspan><tspan x="1014" dy="28">stored probe offsets place each measurement.</tspan></text></svg>