47" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="949.0" dy="0">Grids, filtered data, derivatives,</tspan><tspan x="949.0" dy="17">interpretation products</tspan></text><path d="M 799,592 V 654 A 150.0,18 0 0 0 1099,654 V 592" fill="url(#cylGrad)" fill-opacity="0.98" /><ellipse cx="949.0" cy="654" rx="150.0" ry="18" fill="#adc6db" stroke="#ffffff" stroke-width="1.2" /><text x="949.0" y="621" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle">Provenance</text><text x="949.0" y="645" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="949.0" dy="0">Full processing history</tspan><tspan x="949.0" dy="17">for reproducibility</tspan></text><rect x="1166" y="185" width="322" height="96" rx="10" fill="#fffdf8" fill-opacity="0.92" stroke="#dab06d" stroke-width="1.2" /><text x="1327.0" y="219" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle">Survey processing</text><text x="1327.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="1327.0" dy="0">Despike, detrend, levelling,</tspan><tspan x="1327.0" dy="18">line/traverse corrections</tspan></text><rect x="1166" y="296" width="322" height="96" rx="10" fill="#fffdf8" fill-opacity="0.92" stroke="#dab06d" stroke-width="1.2" /><text x="1327.0" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle">Observation filters</text><text x="1327.0" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="1327.0" dy="0">Noise removal, destriping,</tspan><tspan x="1327.0" dy="18">background removal</tspan></text><rect x="1166" y="407" width="322" height="96" rx="10" fill="#fffdf8" fill-opacity="0.92" stroke="#dab06d" stroke-width="1.2" /><text x="1327.0" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle">Interpolation</text><text x="1327.0" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="1327.0" dy="0">TIN, IDW, kriging,</tspan><tspan x="1327.0" dy="18">explicit support masks</tspan></text><rect x="1166" y="518" width="322" height="96" rx="10" fill="#fffdf8" fill-opacity="0.92" stroke="#dab06d" stroke-width="1.2" /><text x="1327.0" y="552" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle">Raster filters</text><text x="1327.0" y="580" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="1327.0" dy="0">Gaussian / median, FFT filters,</tspan><tspan x="1327.0" dy="18">plane removal, upward continuation</tspan></text><rect x="1166" y="629" width="322" height="96" rx="10" fill="#fffdf8" fill-opacity="0.92" stroke="#dab06d" stroke-width="1.2" /><text x="1327.0" y="663" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle">QC &amp; analysis</text><text x="1327.0" y="691" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="1327.0" dy="0">Statistics, profiles,</tspan><tspan x="1327.0" dy="18">spectral analysis, anomaly enhancement</tspan></text><rect x="1534" y="185" width="322" height="110" rx="10" fill="#fffdf8" fill-opacity="0.92" stroke="#e3c06d" stroke-width="1.2" /><text x="1695.0" y="219" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle">Quantitative files</text><text x="1695.0" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fi