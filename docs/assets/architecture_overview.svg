<rect x="28" y="90" width="350" height="690" rx="12" fill="#deedf8" fill-opacity="1.0" stroke="#76b8e1" stroke-width="1.6" /><path d="M 40,90 H 366 Q 378,90 378,102 V 170 H 28 V 102 Q 28,90 40,90 Z" fill="#216bb8" /><text x="203.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">1. INPUT DATA</text><text x="203.0" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">Multiple formats, one workflow</text><rect x="396" y="90" width="350" height="690" rx="12" fill="#def1f5" fill-opacity="1.0" stroke="#83c6d4" stroke-width="1.6" /><path d="M 408,90 H 734 Q 746,90 746,102 V 170 H 396 V 102 Q 396,90 408,90 Z" fill="#2c8aa3" /><text x="571.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">2. READERS &amp; POSITIONING</text><text x="571.0" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">Get the data in context</text><rect x="764" y="90" width="370" height="690" rx="12" fill="#dff2e6" fill-opacity="1.0" stroke="#84c8a0" stroke-width="1.6" /><path d="M 776,90 H 1122 Q 1134,90 1134,102 V 170 H 764 V 102 Q 764,90 776,90 Z" fill="#2c7b57" /><text x="949.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">3. PROJECT DATA MODEL</text><text x="949.0" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">A unified, traceable structure</text><rect x="1152" y="90" width="350" height="690" rx="12" fill="#f8eedc" fill-opacity="1.0" stroke="#dab06d" stroke-width="1.6" /><path d="M 1164,90 H 1490 Q 1502,90 1502,102 V 170 H 1152 V 102 Q 1152,90 1164,90 Z" fill="#b7772b" /><text x="1327.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">4. PROCESSING &amp; ANALYSIS</text><text x="1327.0" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">Turn data into information</text><rect x="1520" y="90" width="350" height="690" rx="12" fill="#f8eed4" fill-opacity="1.0" stroke="#e3c06d" stroke-width="1.6" /><path d="M 1532,90 H 1858 Q 1870,90 1870,102 V 170 H 1520 V 102 Q 1520,90 1532,90 Z" fill="#cf8b1f" /><text x="1695.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">5. OUTPUT &amp; INSPECTION</text><text x="1695.0" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">Share, visualise, integrate</text><path d="M 368,419 H 388 V 408 L 406,430 L 388,452 V 441 H 368 Z" fill="#2a7fb2" stroke="#ffffff" stroke-width="2.2" filter="url(#shadow)" /><path d="M 736,419 H 756 V 408 L 774,430 L 756,452 V 441 H 736 Z" fill="#2b9aa2" stroke="#ffffff" stroke-width="2.2" filter="url(#shadow)" /><path d="M 1124,419 H 1144 V 408 L 1162,430 L 1144,452 V 441 H 1124 Z" fill="#2a8a56" stroke="#ffffff" stroke-width="2.2" filter="url(#shadow)" /><path d="M 1492,419 H 1512 V 408 L 1530,430 L 1512,452 V 441 H 1492 Z" fill="#be7f2f" stroke="#ffffff" stroke-width="2.2" filter="url(#shadow)" /><rect x="42" y="185" width="322" height="110" rx="10" fill="#fbfdff" fill-opacity="0.92" stroke="#76b8e1" stroke-width="1.2" /><text x="203.0" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#123154" text-anchor="middle"><tspan x="203.0" dy="0">Supported native</tspan><tspan x="203.0" dy="22">multichannel files</tspan></text><text x="203.0" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#35506f" text-anchor="middle"><tspan x="203.0" dy="0">SENSYS PRM structures</tspan></text><rect x="42" y="312" width="322" height="110" rx="10" fi